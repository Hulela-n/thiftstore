<!DOCTYPE html>
<html lang="en">
<head>
  <title>SPECIAL REQUEST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles_special_requests.css"></link>
</head>
<body>
  <main>
    <div class="top">
        <h1>SELF-SERVICE</h1>
    </div>
    <div class="feedback">
        <h2 class="feedback" onclick="talkToUS()">FIND OUT MORE</h2>
            <div class="feedback-input" id="FBox">
                <input class="feedback-input" type="tel" placeholder="0712345678" required></input>
                <p class="feedback-input" >CELLPHONE NUMBER</p>
                <input class="feedback-input"  type="email" placeholder="email@example.com" required></input>
                <p class="feedback-input">EMAIL ADDRESS</p>
                <input class="feedback-input"  type="file" id="file" name="file">
                <input class="feedback-input-textbox" type="text" placeholder="TYPE HERE..."></input><br>
                <button class="feedback-input" type="submit">SUBMIT</button><br><br>
            </div>
    </div>
  </main>
  <script src="grab_item.js"></script>
</body>
</html>
